  function whyWorks(){
    var intro='Everything in The Driveway is built on real, widely-used techniques — the same ones taught in therapy, peer support, and tactical training. None of it is invented here. If you ever want to know what’s actually happening when you use a tool, it’s all below. No pressure to read any of it — it’s just here if you ever want it.';
    var groups=[
      ['The Glovebox',[
        ['Cyclic sighing','Two breaths in through the nose, then one long breath out through the mouth. It’s the fastest way to bring your body down a notch — a Stanford study found a few minutes of it lowered stress and steadied mood better than most things people try. Your body already does it on its own when it’s starting to calm down; this just does it on purpose.'],
        ['Box breathing','In for four, hold for four, out for four, hold for four. This is the breathing SEALs, cops, and firefighters are taught to steady themselves before and after a bad one. The even, counted rhythm gives your mind one simple thing to hold, and pulls your heart rate down with it.'],
        ['Coherent breathing','Slowing to about six breaths a minute lines your breathing up with your heart rhythm — researchers call it heart rate variability, and more of it is what calm looks like on the inside. A few minutes here is like letting the engine idle.'],
        ['5-4-3-2-1 grounding','Name five things you can see, four you can hear, and so on down. When your head is spinning or somewhere else entirely, naming what’s actually around you drags your attention out of the loop and back into the room. It’s a go-to tool for panic and flashbacks because it works fast.'],
        ['Guided imagery','Picturing a place you feel safe isn’t just “thinking happy thoughts.” Your nervous system responds to a vividly imagined scene a lot like a real one — so building that safe place in detail actually lowers the alarm in your body. Athletes and the military use the same visualization to steady themselves.'],
        ['Self-compassion','Talking to yourself the way you’d talk to a buddy who had a rough one — instead of tearing yourself down — measurably lowers the internal threat response. It builds resilience better than being hard on yourself ever does. In our line of work, that’s a skill.'],
        ['Guided meditation','A few quiet minutes of guided attention trains your mind to step back from the loop instead of getting pulled under by it. This is mindfulness — studied for years now for stress, sleep, and burnout. You’re not emptying your head; you’re learning to let the hard stuff pass through without grabbing onto it.'],
        ['Calming sounds','Steady, low sound gives your nervous system something even and predictable to settle on, which makes it easier to come down or drift off. Nothing fancy — just a calmer backdrop.']
      ]],
      ['The rest of the app',[
        ['Journaling','Writing about a hard day isn’t a diary thing — it’s called expressive writing, and it’s one of the most studied tools there is. Getting what happened out of your head and onto the page lowers the stress it carries, and over time it’s been shown to help your body, not just your mood.'],
        ['The Unload','Getting something off your chest works for a reason. Just putting words to what you’re carrying calms the alarm part of your brain — researchers call it “affect labeling,” or plainly, “name it to tame it.” And because the Unload keeps nothing, it reinforces the part that helps most: you can set it down. It doesn’t have to be yours to carry inside.'],
        ['Talk It Out','Putting a feeling into words takes some of the charge out of it — whether you say it to a person or type it here. Sometimes you’re not ready to talk to somebody, and that’s exactly when getting it out of your head and into words still helps. It’s the same reason venting to someone you trust works — this is a version that’s awake at 3 a.m. and never repeats it.']
      ]]
    ];
    var closing='These are tools for decompressing and looking after yourself — not treatment, and not a replacement for a professional when you need one. If you’re struggling, reach out. You’re not alone in this.';
    var body='';
    groups.forEach(function(g){
      body+='<p style="margin:22px 2px 10px;font-size:11px;font-weight:600;letter-spacing:.5px;color:'+C.MUT+';text-transform:uppercase;">'+g[0]+'</p>';

  function mirror(){var mc={W:'#B4553C',H:'#C88A5B',O:'#C9B77E',S:'#3E9B8C',G:'#4FA890'},lvl={W:1,H:2,O:3,S:4,G:5};var mentries=[];['personal','work'].forEach(function(tb){(jdata[tb]||[]).forEach(function(e){mentries.push(e);});});mentries.sort(function(a,b){return (a.ts||0)-(b.ts||0);});var mN=mentries.length;var codes=['W','H','O','S','G'];var recent=mentries.slice(-14);var strip=recent.map(function(e){return codes[(e.reflection?e.reflection.mood:e.mood)||0];});if(strip.length<2)strip=['O','S'];var mBest=toolboxSuggest();var mWith=0,mImp=0;mentries.forEach(function(e){if(e.kind==='checkin'&&e.reflection){mWith++;if(e.reflection.mood>e.mood)mImp++;}});var avM=function(a){return a.reduce(function(s,e){return s+((e.reflection?e.reflection.mood:e.mood)||0);},0)/a.length;};var mDe=(recent.length>=4?(avM(recent.slice(Math.floor(recent.length/2)))-avM(recent.slice(0,Math.floor(recent.length/2)))):0);var mSub=(recent.length<4?'Your recent check-ins.':(mDe>0.4?'Trending up — more steady days than at the start.':(mDe<-0.4?'A heavier stretch lately — be good to yourself.':'Holding fairly steady.')));var Wd=288,Hd=60,pts=strip.map(function(s,i){return [6+i*((Wd-12)/(Math.max(1,strip.length-1))),Hd-6-((lvl[s]-1)/4)*(Hd-14),mc[s]];});var svg='<svg viewBox="0 0 '+Wd+' '+Hd+'" width="100%" height="'+Hd+'" preserveAspectRatio="none"><polyline points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'" fill="none" stroke="#C9C7BF" stroke-width="1.5"/>'+pts.map(function(p){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="'+p[2]+'"/>';}).join('')+'</svg>';
    function card(icon,tile,title,body){return '<div style="background:var(--card);border:0.5px solid '+C.LINE+';border-radius:16px;padding:15px 16px;margin-bottom:12px;"><div style="display:flex;align-items:flex-start;gap:12px;"><span style="width:40px;height:40px;border-radius:12px;background:'+tile+';display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="ti '+icon+'" style="font-size:21px;color:'+C.TEALT+'"></i></span><div style="flex:1;"><p style="margin:0 0 3px;font-size:15px;font-weight:500;color:'+C.TXT+'">'+title+'</p><p style="margin:0;font-size:13.5px;color:'+C.SOFT+';line-height:1.55;">'+body+'</p></div></div></div>';}
    show(sb(true)+'<div style="background:var(--ink);padding:8px 18px 16px;flex-shrink:0;"><div style="display:flex;align-items:center;gap:10px;"><i class="ti ti-chevron-left" id="mback" style="color:var(--dmut);font-size:21px;cursor:pointer;"></i><span style="color:var(--dtext);font-size:17px;font-weight:500;">The Mirror</span><span style="margin-left:auto;color:#8FB6AE;font-size:11px;"><i class="ti ti-lock" style="font-size:11px;"></i> only you</span></div><p style="margin:9px 0 0;color:var(--dmut);font-size:12.5px;line-height:1.45;">Patterns from your own check-ins — just what I’m noticing.</p></div><div style="flex:1;overflow-y:auto;padding:16px 16px 20px;"><div style="background:var(--card);border:0.5px solid '+C.LINE+';border-radius:16px;padding:15px 16px;margin-bottom:12px;"><p style="margin:0 0 2px;font-size:13px;font-weight:500;color:'+C.TXT+'">How your days have felt</p><p style="margin:0 0 12px;font-size:12px;color:'+C.MUT+'">'+mSub+'</p><div style="display:flex;gap:8px;"><div style="display:flex;flex-direction:column;justify-content:space-between;height:60px;padding:2px 0;"><span style="font-size:10px;color:'+C.MUT+'">Good</span><span style="font-size:10px;color:'+C.MUT+'">Rough</span></div><div style="flex:1;">'+svg+'</div></div></div>'+(mBest?card('ti-barbell','var(--tsoft)',mBest.label+' shows up in your better days','When you did '+mBest.label.toLowerCase()+' after a rough shift, your mood lifted more than anything else you’ve logged. Might be your most reliable tool — yours, not mine.'):'')+(mWith>0?card('ti-trending-up','var(--tsoft)',mImp+' of '+mWith+' rough night'+(mWith===1?'':'s')+' turned around by bedtime','On the nights you checked back in, '+mImp+' time'+(mImp===1?'':'s')+' what you did actually moved your mood up — that’s the whole idea working.'):'')+card('ti-heart-handshake','var(--asoft)',mN+' check-in'+(mN===1?'':'s')+' logged','Even on the weeks that took a lot out of you, you kept showing up for yourself. That counts.')+((!mBest&&mWith===0)?card('ti-bulb','var(--tsoft)','Still learning your patterns','Keep checking in — after a shift, and again before bed — and I’ll start showing you what actually helps you.'):'')+'<p style="margin:6px 4px 0;font-size:11.5px;color:'+C.MUT+';text-align:center;line-height:1.5;">Lives on your phone — a hand on your shoulder, nothing more.</p></div>'+nav(''));
    document.getElementById('mback').onclick=function(){go('home');};bindNav();}

  /* ROUTER */
  var state='ob-role';
  function go(v){clearT();state=v;window.scrollTo&&0;
    if(v==='splash')splash();else if(v==='lock')lock();else if(v==='ob-role')obRole();else if(v==='ob-years')obYears();else if(v==='ob-zip')obZip();else if(v==='ob-shift')obShift();else if(v==='ob-bed')obBed();else if(v==='ob-about')obAbout();else if(v==='ob-voice')obVoice();else if(v==='ob-theme')obTheme();else if(v==='ob-welcome')obWelcome();
    else if(v==='home')home();else if(v==='journal')journal();else if(v==='glovebox')glovebox();else if(v==='support')support();else if(v==='suggest')suggest();else if(v==='reminders')reminders();else if(v==='settings')settings();else if(v==='about')about();else if(v==='whyworks')whyWorks();else if(v==='feedback')feedback();else if(v==='feedback-sent')feedbackSent();else if(v==='paywall')paywall();else if(v==='pw-started')pwStarted();else if(v==='membership')membership();else if(v==='backup')backup();else if(v==='disclaimer')disclaimer();else if(v==='tour')tour();else if(v==='demo')demoPlay();else if(v==='mirror')mirror();else if(v==='chat')chatView();
    else if(v==='ci-onramp')onramp();else if(v==='ci-q1')ciQ(1);else if(v==='ci-q2')ciQ(2);else if(v==='ci-q3')ciQ(3);else if(v==='ci-q4')ciQ(4);else if(v==='ci-rem')ciRem();else if(v==='ci-logged')ciLogged();else if(v==='ci-offramp')ciOfframp();else if(v==='ci-done')ciDone();else if(v==='ci-bed')ciBed();else if(v==='ci-bed-done')ciBedDone();
    else if(v==='tool-breath')toolBreath();else if(v==='tool-flow')toolFlow();else if(v==='tool-sound')toolSound();
    else if(v==='med-list')medList();else if(v==='med-play')medPlay();else if(v==='snd-done')sndDone();
    else if(v==='unload-write')unloadWrite();else if(v==='unload-done')unloadDone();
    markJumps(v);
  }
  var jumpDefs=[['splash','Launch'],['lock','Open'],['disclaimer','Disclaimer'],['ob-role','Onboarding'],['home','Home'],['ci-onramp','Check-in'],['ci-bed','Bedtime'],['chat','AI chat'],['glovebox','Glovebox'],['med-list','Meditate'],['unload-write','Unload'],['journal','Journal'],['support','Support'],['reminders','Reminders'],['settings','Settings'],['about','Memory'],['feedback','Feedback'],['paywall','Upgrade'],['tour','Tour'],['demo','Tutorial'],['mirror','Mirror']];
  function markJumps(active){var box=document.getElementById('jumps');if(!box)return;box.innerHTML=jumpDefs.map(function(j){return '<button data-j="'+j[0]+'" class="'+(j[0]===active?'on':'')+'">'+j[1]+'</button>';}).join('');box.querySelectorAll('button').forEach(function(b){b.onclick=function(){go(b.dataset.j);};});}
  /* Persist setup + profile + journal on-device (hosted tester build only), so the app
     doesn't re-run onboarding every launch. Nothing leaves the device. */
  var setupDone=false;
  /* ENCRYPTED STORAGE: native uses the OS secure store (iOS Keychain / Android EncryptedSharedPreferences); web falls back to localStorage. */
  var SS_PFX='capacitor-storage_';
  function secureStore(){var CAP=(typeof window!=='undefined')&&window.Capacitor;return (CAP&&CAP.isNativePlatform&&CAP.isNativePlatform()&&CAP.Plugins&&CAP.Plugins.SecureStorage)||null;}
  function ssSet(k,v){var SS=secureStore();if(!SS)return Promise.resolve();return SS.internalSetItem({prefixedKey:SS_PFX+k,data:v,sync:false}).catch(function(){});}
  function ssGet(k){var SS=secureStore();if(!SS)return Promise.resolve(null);return SS.internalGetItem({prefixedKey:SS_PFX+k,sync:false}).then(function(r){return (r&&r.data!=null)?r.data:null;}).catch(function(){return null;});}
  function ssRemove(k){var SS=secureStore();if(!SS)return Promise.resolve();return SS.internalRemoveItem({prefixedKey:SS_PFX+k,sync:false}).catch(function(){});}
  function saveState(){if(!TESTMODE)return;try{var su=setupDone?'1':'0',pr=JSON.stringify(profile),jd=JSON.stringify(jdata);if(secureStore()){ssSet('dw_setup',su);ssSet('dw_profile',pr);ssSet('dw_jdata',jd);}else{localStorage.setItem('dw_setup',su);localStorage.setItem('dw_profile',pr);localStorage.setItem('dw_jdata',jd);}}catch(e){}}
  function loadState(){if(!TESTMODE)return;try{var p=localStorage.getItem('dw_profile');if(p){var o=JSON.parse(p);for(var k in o){if(o.hasOwnProperty(k))profile[k]=o[k];}}var j=localStorage.getItem('dw_jdata');if(j){var jj=JSON.parse(j);if(jj&&jj.personal&&jj.work)jdata=jj;}setupDone=(localStorage.getItem('dw_setup')==='1');}catch(e){}applyTheme();}
  /* NATIVE SCHEDULED NOTIFICATIONS (shift-end nudge + volunteer weekly). No-op on web. */
  function syncNotifications(){try{
    var CAP=(typeof window!=='undefined')&&window.Capacitor;
    if(!CAP||!CAP.isNativePlatform||!CAP.isNativePlatform())return;
    var LN=CAP.Plugins&&CAP.Plugins.LocalNotifications;if(!LN)return;
    LN.requestPermissions().then(function(){
      return LN.cancel({notifications:[{id:7001},{id:7002}]});
    }).then(function(){
      var s=profile.schedule||{};var list=[];
      if(s.mode==='volunteer'){
        var wt=(s.offTime||'19:00').split(':');
        list.push({id:7002,title:'The Driveway',body:'Your weekly check-in — how’d the week go? Any '+evWord(true)+' stick with you?',schedule:{on:{weekday:((s.weeklyDay||0)+1),hour:+wt[0],minute:+wt[1]},repeats:true,allowWhileIdle:true}});
      }else if(s.mode&&s.mode!=='varies'&&s.trigger==='time'&&s.offDate&&s.offTime){
        var d=new Date(s.offDate+'T'+s.offTime+':00');d.setMinutes(d.getMinutes()+(s.delayMin||0));
        if(d.getTime()>Date.now()+5000){
          list.push({id:7001,title:'The Driveway',body:'You made it home. These five minutes are yours — before the day pulls you back.',schedule:{at:d,allowWhileIdle:true}});
        }
      }
      if(list.length)return LN.schedule({notifications:list});
    }).catch(function(){});
  }catch(e){}}
  function resetState(){try{localStorage.removeItem('dw_setup');localStorage.removeItem('dw_profile');localStorage.removeItem('dw_jdata');}catch(e){}var done=function(){if(typeof location!=='undefined'&&location.reload)location.reload();};if(secureStore()){Promise.all([ssRemove('dw_setup'),ssRemove('dw_profile'),ssRemove('dw_jdata')]).then(done,done);}else{done();}}
  function bootLoad(){if(!TESTMODE||!secureStore()){loadState();go('splash');return;}
    Promise.all([ssGet('dw_profile'),ssGet('dw_jdata'),ssGet('dw_setup')]).then(function(res){
      var p=res[0],j=res[1],su=res[2];
      if(p==null&&j==null){try{var lp=localStorage.getItem('dw_profile');if(lp){p=lp;j=localStorage.getItem('dw_jdata');su=localStorage.getItem('dw_setup');ssSet('dw_profile',lp);if(j)ssSet('dw_jdata',j);if(su)ssSet('dw_setup',su);localStorage.removeItem('dw_profile');localStorage.removeItem('dw_jdata');localStorage.removeItem('dw_setup');}}catch(e){}}
      try{if(p){var o=JSON.parse(p);for(var k in o){if(o.hasOwnProperty(k))profile[k]=o[k];}}if(j){var jj=JSON.parse(j);if(jj&&jj.personal&&jj.work)jdata=jj;}setupDone=(su==='1');}catch(e){}applyTheme();
      go('splash');
    },function(){go('splash');});}
  bootLoad();
})();
