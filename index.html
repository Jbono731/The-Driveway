    S.querySelectorAll('.rtog').forEach(function(b){b.onclick=function(){rems[+b.dataset.i].on=!rems[+b.dataset.i].on;reminders();};});var es=document.getElementById('editsched');if(es)es.onclick=function(){shiftRet='reminders';go('ob-shift');};bindNav();}

  /* MIRROR */
  function mirror(){var mc={W:'#B4553C',H:'#C88A5B',O:'#C9B77E',S:'#3E9B8C',G:'#4FA890'},lvl={W:1,H:2,O:3,S:4,G:5};var strip=['H','W','H','O','H','O','S','O','S','H','S','S','G','S'];var Wd=288,Hd=60,pts=strip.map(function(s,i){return [6+i*((Wd-12)/13),Hd-6-((lvl[s]-1)/4)*(Hd-14),mc[s]];});var svg='<svg viewBox="0 0 '+Wd+' '+Hd+'" width="100%" height="'+Hd+'" preserveAspectRatio="none"><polyline points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'" fill="none" stroke="#C9C7BF" stroke-width="1.5"/>'+pts.map(function(p){return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="'+p[2]+'"/>';}).join('')+'</svg>';
    function card(icon,tile,title,body){return '<div style="background:#fff;border:0.5px solid '+C.LINE+';border-radius:16px;padding:15px 16px;margin-bottom:12px;"><div style="display:flex;align-items:flex-start;gap:12px;"><span style="width:40px;height:40px;border-radius:12px;background:'+tile+';display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="ti '+icon+'" style="font-size:21px;color:'+C.TEALT+'"></i></span><div style="flex:1;"><p style="margin:0 0 3px;font-size:15px;font-weight:500;color:'+C.TXT+'">'+title+'</p><p style="margin:0;font-size:13.5px;color:'+C.SOFT+';line-height:1.55;">'+body+'</p></div></div></div>';}
    show(sb(true)+'<div style="background:#2B343C;padding:8px 18px 16px;flex-shrink:0;"><div style="display:flex;align-items:center;gap:10px;"><i class="ti ti-chevron-left" id="mback" style="color:#9FB0B8;font-size:21px;cursor:pointer;"></i><span style="color:#F3F0EA;font-size:17px;font-weight:500;">The Mirror</span><span style="margin-left:auto;color:#8FB6AE;font-size:11px;"><i class="ti ti-lock" style="font-size:11px;"></i> only you</span></div><p style="margin:9px 0 0;color:#9FB0B8;font-size:12.5px;line-height:1.45;">Patterns from your own check-ins — just what I’m noticing.</p></div><div style="flex:1;overflow-y:auto;padding:16px 16px 20px;"><div style="background:#fff;border:0.5px solid '+C.LINE+';border-radius:16px;padding:15px 16px;margin-bottom:12px;"><p style="margin:0 0 2px;font-size:13px;font-weight:500;color:'+C.TXT+'">How your days have felt</p><p style="margin:0 0 12px;font-size:12px;color:'+C.MUT+'">Last two weeks · more steady days than at the start.</p><div style="display:flex;gap:8px;"><div style="display:flex;flex-direction:column;justify-content:space-between;height:60px;padding:2px 0;"><span style="font-size:10px;color:'+C.MUT+'">Good</span><span style="font-size:10px;color:'+C.MUT+'">Rough</span></div><div style="flex:1;">'+svg+'</div></div></div>'+card('ti-moon','#EDE7F3','Nights are the heavy ones','You’ve logged Heavy or Drained after 3 of your last 4 night shifts — more than any other kind of day.')+card('ti-barbell','#E4F0EB','The gym shows up in your good days','8 of your 10 steadiest days came after a workout. Might be your most reliable tool — yours, not mine.')+card('ti-heart-handshake','#FBF1E3','Twelve check-ins this month','Even on the weeks that took a lot out of you, you kept showing up for yourself. That counts.')+'<p style="margin:6px 4px 0;font-size:11.5px;color:'+C.MUT+';text-align:center;line-height:1.5;">Lives on your phone — a hand on your shoulder, nothing more.</p></div>'+nav(''));
    document.getElementById('mback').onclick=function(){go('home');};bindNav();}

  /* ROUTER */
  var state='ob-role';
  function go(v){clearT();state=v;window.scrollTo&&0;
    if(v==='splash')splash();else if(v==='lock')lock();else if(v==='ob-role')obRole();else if(v==='ob-years')obYears();else if(v==='ob-zip')obZip();else if(v==='ob-shift')obShift();else if(v==='ob-bed')obBed();else if(v==='ob-welcome')obWelcome();
    else if(v==='home')home();else if(v==='journal')journal();else if(v==='glovebox')glovebox();else if(v==='support')support();else if(v==='suggest')suggest();else if(v==='reminders')reminders();else if(v==='settings')settings();else if(v==='backup')backup();else if(v==='disclaimer')disclaimer();else if(v==='tour')tour();else if(v==='demo')demoPlay();else if(v==='mirror')mirror();else if(v==='chat')chatView();
    else if(v==='ci-onramp')onramp();else if(v==='ci-q1')ciQ(1);else if(v==='ci-q2')ciQ(2);else if(v==='ci-q3')ciQ(3);else if(v==='ci-q4')ciQ(4);else if(v==='ci-rem')ciRem();else if(v==='ci-logged')ciLogged();else if(v==='ci-offramp')ciOfframp();else if(v==='ci-done')ciDone();
    else if(v==='tool-breath')toolBreath();else if(v==='tool-flow')toolFlow();else if(v==='tool-sound')toolSound();
    else if(v==='unload-write')unloadWrite();else if(v==='unload-done')unloadDone();
    markJumps(v);
  }
  var jumpDefs=[['splash','Launch'],['lock','Open'],['disclaimer','Disclaimer'],['ob-role','Onboarding'],['home','Home'],['ci-onramp','Check-in'],['chat','AI chat'],['glovebox','Glovebox'],['unload-write','Unload'],['journal','Journal'],['support','Support'],['reminders','Reminders'],['settings','Settings'],['tour','Tour'],['demo','Tutorial'],['mirror','Mirror']];
  function markJumps(active){var box=document.getElementById('jumps');if(!box)return;box.innerHTML=jumpDefs.map(function(j){return '<button data-j="'+j[0]+'" class="'+(j[0]===active?'on':'')+'">'+j[1]+'</button>';}).join('');box.querySelectorAll('button').forEach(function(b){b.onclick=function(){go(b.dataset.j);};});}
  /* Persist setup + profile + journal on-device (hosted tester build only), so the app
     doesn't re-run onboarding every launch. Nothing leaves the device. */
  var setupDone=false;
  function saveState(){if(!TESTMODE)return;try{localStorage.setItem('dw_setup',setupDone?'1':'0');localStorage.setItem('dw_profile',JSON.stringify(profile));localStorage.setItem('dw_jdata',JSON.stringify(jdata));}catch(e){}}
  function loadState(){if(!TESTMODE)return;try{var p=localStorage.getItem('dw_profile');if(p){var o=JSON.parse(p);for(var k in o){if(o.hasOwnProperty(k))profile[k]=o[k];}}var j=localStorage.getItem('dw_jdata');if(j){var jj=JSON.parse(j);if(jj&&jj.personal&&jj.work)jdata=jj;}setupDone=(localStorage.getItem('dw_setup')==='1');}catch(e){}}
  function resetState(){try{localStorage.removeItem('dw_setup');localStorage.removeItem('dw_profile');localStorage.removeItem('dw_jdata');}catch(e){}if(typeof location!=='undefined'&&location.reload)location.reload();}
  loadState();
  go('splash');
})();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}</script>
